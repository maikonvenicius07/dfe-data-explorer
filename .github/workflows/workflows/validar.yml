name: Validar código e seleção
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_import.py
      - run: node --check public/app.js
      - run: node --check public/pdf-export.js
      - run: node --check public/selection.js
      - run: node --check public/diagram-state.js
      - run: node tests/test_diagram_progressive_v234.js
      - run: node tests/test_selection_logic_v23.js
      - run: node tests/test_integrated_selection_v235.js
      - run: python -m pytest -q tests/test_publication_v232.py
      - run: python scripts/build_offline.py
