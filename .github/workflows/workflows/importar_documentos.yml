name: Importar leiautes de todos os DF-e
on:
  workflow_dispatch:
    inputs:
      documento:
        description: Documento (all ou chave do catálogo)
        type: string
        default: all
  workflow_call:
    inputs:
      documento:
        type: string
        default: all
  push:
    branches: [main]
    paths:
      - 'scripts/import_documents.py'
      - '.github/workflows/importar_documentos.yml'
permissions:
  contents: write
  actions: write
  pages: write
concurrency:
  group: importar-documentos
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_import_documents_v2321.py tests/test_import_dce.py
      - name: Coletar manuais e gerar catálogos
        id: collect
        continue-on-error: true
        env:
          DOCUMENTO: ${{ inputs.documento || 'all' }}
        run: |
          if [ "$DOCUMENTO" = all ]; then python scripts/import_documents.py; else python scripts/import_documents.py --document "$DOCUMENTO"; fi
      - name: Registrar catálogos e diagnóstico
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/ public/index.html public/EXPLORADOR_OFFLINE_COMPLETO.html
          if [ -d data/documents ]; then git add data/documents/; fi
          if ! git diff --cached --quiet; then
            git commit -m 'dados: importar leiautes multidocumento'
            git push
          fi
      - name: Relatório da importação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-documentos
          path: public/data/importacao_documentos.json
          if-no-files-found: warn
      - name: Solicitar nova publicação conforme configuração do Pages
        if: steps.commit.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tipo=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' || true)
          if [ "$tipo" = workflow ]; then
            gh workflow run publicar_paginas.yml --ref main
          elif [ "$tipo" = legacy ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo 'Solicite a publicação pelo GitHub Pages; confira permissões.'
          else
            echo 'Não foi possível identificar a configuração do Pages. Publique manualmente.'
          fi
      - name: Sinalizar fontes com falha
        if: steps.collect.outcome == 'failure'
        run: exit 1
